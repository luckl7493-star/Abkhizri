<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌿 Aab-e-Khizri Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf5fd;--card:#fff;--tx:#10283a;--mu:#47627a;--g:#3f93c4;--g2:#63b0dc;--r:#e0584b;--y:#ffd466;--bd:#d3e8f6;--ac:#3f93c4;--acs:#63b0dc;--hbg1:#c5e4f7;--hbg2:#a5d3ee;--htx:#1d4a68;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-role=user]{--ac:#1a7a3a;--acs:#2f9f50;--hbg1:#a8dfba;--hbg2:#7cc99a;--htx:#17482b}
[data-role=admin]{--ac:#6b3db5;--acs:#8a5cd8;--hbg1:#c8aff5;--hbg2:#a88ae0;--htx:#2a0a5a}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#d9eefc 0,#e8f5fd 50%,#f2f9fe 100%) fixed;color:var(--tx);font-family:Poppins,"Noto Nastaliq Urdu",sans-serif;line-height:1.6;min-height:100vh}
[data-role=user] body{background:linear-gradient(180deg,#c8ecd4 0,#dff2e7 50%,#f0faf4 100%) fixed}
[data-role=admin] body{background:linear-gradient(180deg,#e0d4f7 0,#ede4ff 50%,#f7f2ff 100%) fixed}

/* HEADER */
header{background:linear-gradient(135deg,var(--hbg1),var(--hbg2));color:var(--htx);padding:16px 16px 12px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 6px 18px #0001;position:relative}
header h1{margin:0;font-size:22px;font-weight:700}
header .ur-sub{font-family:"Noto Nastaliq Urdu",serif;font-size:17px;color:#9a6a00;line-height:1.8;display:none}
header small{font-size:12px;opacity:.85}
.hdr-btns{position:absolute;top:12px;right:12px;display:flex;gap:6px}
[dir=rtl] .hdr-btns{right:auto;left:12px}
.hdr-btn{background:#ffffff50;border:0;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--htx)}
.hdr-btn:hover{background:#ffffff80}

/* ROLE PICKER (landing) */
.role-pick{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px;padding:24px}
.role-pick h2{font-size:22px;margin:0 0 8px;text-align:center;color:var(--ac)}
.rcard{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:18px 22px;width:100%;max-width:360px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;box-shadow:0 4px 14px #0001}
.rcard:hover{transform:translateY(-3px);box-shadow:0 8px 24px #0002;border-color:var(--ac)}
.rcard .ri{font-size:36px;flex:none}
.rcard .rt{font-weight:700;font-size:16px}
.rcard .rs{font-size:12px;color:var(--mu);margin-top:2px}

/* SHELL + SIDEBAR */
.shell{display:flex;gap:0;max-width:1000px;margin:0 auto;padding:14px 8px 0;direction:ltr}
.mainc{flex:1;min-width:0}
main{padding:0 0 24px}
#side{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));flex:none;width:70px;display:none;flex-direction:column;gap:5px;background:#ffffffd8;backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:22px;padding:8px 4px 12px;box-shadow:0 6px 22px #0001;margin-left:10px}
#side.vis{display:flex}
.sb{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:9px 2px;background:transparent;color:var(--mu);border:0;border-radius:14px;font-size:10px;font-weight:600;line-height:1.2;text-align:center;cursor:pointer;transition:background .15s}
.sb:hover{background:color-mix(in srgb,var(--ac) 10%,transparent)}
.sb .si{font-size:22px;line-height:1}
.sb.on{background:linear-gradient(135deg,#ffd466,#ffe9a8);color:#4a3300;box-shadow:0 2px 8px #ffd46688}
.sb.danger{color:#e0584b}
.sb.danger:hover{background:#fbd5d5}
.side-sep{border:0;border-top:1px dashed var(--bd);margin:4px 6px}
@media(min-width:600px){#side{width:130px;padding:10px 8px 14px;margin-left:14px}.sb{flex-direction:row;justify-content:flex-start;gap:10px;font-size:13px;padding:10px 12px;text-align:start}.sb .si{font-size:20px}}

/* CARDS */
.card{background:var(--card);border:1px solid #d9ecf8;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px #0001;animation:fadein .3s ease both}
[data-role=user] .card{border-color:#cde9d5}
[data-role=admin] .card{border-color:#e0d8f5}
.hero{background:linear-gradient(135deg,#fffaf0,#fdeec0);border-color:#f1dc9a!important}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* FORMS */
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:#fbfdff;color:#0a1c2e;font:inherit;font-size:14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acs);box-shadow:0 0 0 3px color-mix(in srgb,var(--acs) 25%,transparent)}

/* BUTTONS */
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--acs));color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 40%,transparent);transition:transform .12s}
button:hover{transform:translateY(-1px)}
.btn-green{background:linear-gradient(135deg,#4aa88a,#6cc2a8)!important;box-shadow:0 3px 10px #4aa88a44!important}
.btn-red{background:linear-gradient(135deg,#e0584b,#f08a7e)!important;box-shadow:0 3px 10px #e0584b44!important}
.btn-grey{background:linear-gradient(135deg,#8da3b5,#aebfce)!important;box-shadow:none!important}
.btn-wide{width:100%;margin-top:14px;padding:13px;font-size:16px}

/* MISC */
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.s-new{background:#fff1c2;color:#6b4e00}.s-submitted{background:#d7e8ff;color:#0b3f78}.s-approved{background:#d3f2da;color:#12582a}.s-rejected{background:#fbd5d5;color:#8a1111}.s-cancelled{background:#e6e9ec;color:#46525c}
.mu{color:var(--mu);font-size:13px}
h2{margin:4px 0 12px;font-size:18px;font-weight:700;color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:24px;font-size:15px}
.price{font-size:30px;font-weight:700;color:var(--r);margin:6px 0}
.chip{background:var(--ac);color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;display:inline-block;margin:2px}
.tot{background:#eef7fd;border:1px solid #d9ecf8;border-radius:12px;padding:10px 12px;margin-top:10px}
.phw{display:flex;direction:ltr}.phw span{display:flex;align-items:center;padding:0 12px;background:var(--bd);border-radius:12px 0 0 12px;font-weight:600;color:var(--htx)}.phw input{border-radius:0 12px 12px 0}
.pw{position:relative}.pw input{padding-inline-end:46px}.eye{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);background:none;box-shadow:none;color:inherit;padding:8px;font-size:18px;border:0;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1a3a52;color:#fff;padding:10px 20px;border-radius:99px;z-index:999;display:none;font-size:14px;white-space:nowrap;box-shadow:0 4px 16px #0003}
.kps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kp{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.kp b{display:block;font-size:20px;color:var(--ac)}.kp span{font-size:11px;color:var(--mu)}
.urow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);gap:6px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:72vh;padding:20px}
.login-card{max-width:380px;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:28px 22px;box-shadow:0 8px 30px #0002}
.login-icon{width:80px;height:80px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,var(--hbg1),var(--acs));display:flex;align-items:center;justify-content:center;font-size:38px}
.upload-area{border:2px dashed var(--bd);border-radius:14px;padding:20px;text-align:center;cursor:pointer;transition:border-color .2s;margin-top:8px}
.upload-area:hover{border-color:var(--acs)}
.prod-card{background:color-mix(in srgb,var(--ac) 6%,white);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:8px}
.sec-div{border:0;border-top:1px solid var(--bd);margin:14px 0}
@media print{body *{visibility:hidden}.printing,.printing *{visibility:visible}.printing{position:absolute;left:0;top:0;width:100%;border:0;margin:0}}
</style>
</head>

</div>

<div class="shell" id="shell" style="display:none">
  <div class="mainc"><main id="app"></main></div>

</div>

function normPh(s){let d=s.replace(/\D/g,"");if(d.startsWith("92")&&d.length>=12)d=d.slice(2);d=d.replace(/^0+/,"");return d?"+92"+d:""}

const free=q=>(q>=st.cfg.bulk_from||!(st.cfg.free_per>0))?0:Math.floor(q/st.cfg.free_per)*st.cfg.free_qty;

async function refresh(){
  if(!loggedIn(currentRole)) return;
  try{
    try{const c=await rpc("aab_cfg",{});if(c&&+c.rate>0)Object.assign(st.cfg,{rate:+c.rate,rate_bulk:+c.rate_bulk,bulk_from:+c.bulk_from,min_qty:+c.min_qty,free_per:+c.free_per,free_qty:+c.free_qty,delivery:+c.delivery||0})}catch(e){}
    try{const pc=await rpc("aab_pay_cfg",{});if(pc)st.pay={title:pc.title||"",acct:pc.acct||"",bank:pc.bank||"",adv:+pc.adv||0}}catch(e){}
    const o=await rpc("aab_orders_list",{p_role:S.r,p_id:S.i,p_h:S.h});
    if(o===null){logout();return}st.orders=o;
    try{const ad=await rpc("aab_adv_list",{p_role:S.r,p_id:S.i,p_h:S.h});st.adv={};(ad||[]).forEach(x=>{st.adv[x.oid]=x})}catch(e){}
    if(S.r==="admin"){try{const a=await rpc("aab_accounts_list",{p_id:S.i,p_h:S.h});const g=r=>a.filter(x=>x.role===r).map(({id,name})=>({id,name}));st.creds={admins:g("admin"),users:g("user"),customers:g("customer")}}catch(e){}}
    try{const pr=await rpc("aab_products_list",{});st.products=pr||[]}catch(e){const lp=JSON.parse(localStorage.getItem("aak_products")||"[]");if(lp.length)st.products=lp}

}

function calcTot(){
  const q=Math.max(st.cfg.min_qty,+(($('#cq')||{}).value)||1),f=free(q),r=rate(q);
  const el=$('#tot');if(!el)return;
  let html=`${q} × ₨${r} = <b>₨${q*r}</b>`;
  if(f) html+=`<br>${t("free_note").replace("{f}",f).replace("{t}",q+f)}`;
  if(dv()) html+=`<br>${t("delivery")}: ₨${dv()}`;
  el.innerHTML=html;
}

async function placeOrder(){
  const n=($('#cn').value||"").trim(),ph=normPh(($('#cp').value||"")),a=($('#ca').value||"").trim();
  const q=Math.max(st.cfg.min_qty,+$('#cq').value||st.cfg.min_qty);
  const txnEl=$('#ctxn');const txn=txnEl?(txnEl.value||"").trim():"";
  if(!n||!a){toast(t("err_fill"));return}
  if(!okPh(ph)){toast(t("err_phone"));return}
  if(st.pay.adv>0&&st.pay.acct&&!txn){toast(t("txn_need"));return}
  try{
    const r2=rate(q),f=free(q),tot=q*r2+dv();
    const x=await rpc("aab_place_order",{p_id:S.i,p_h:S.h,p_name:n,p_phone:ph,p_addr:a,p_qty:q,p_free:f,p_rate:r2,p_total:tot,p_delivery:dv()});
    if(!x||!x.id){toast(t("err_net"));return}
    if(txn)try{await rpc("aab_set_adv",{p_id:S.i,p_h:S.h,p_oid:x.id,p_amt:st.pay.adv,p_txn:txn})}catch(e){}
    toast(`🎉 Order received! No: ${x.id}`);await refresh();activeTab="myorders";render();
  }catch(e){toast(t("err_net"))}}

function renderMyOrders(){
  return`<h2>${t("my_orders")} (${st.orders.length})</h2>`+

}

    <h2 style="font-size:15px">${editingProduct?t("edit_product"):t("add_product")}</h2>
    <label>${t("prod_name")}</label><input id="pname" value="${esc(editingProduct?.name||"")}" placeholder="e.g. Cumin Water 1L">
    <label>${t("prod_price")}</label><input id="pprice" type="number" min="0" value="${editingProduct?.price||""}" dir="ltr">
    <label>${t("prod_desc")}</label><input id="pdesc" value="${esc(editingProduct?.desc||"")}" placeholder="Short description">
    <label>${t("prod_html")}</label>
    <textarea id="phtml" rows="5" dir="ltr" placeholder="<div style='background:#fff3;...'>...</div>">${esc(editingProduct?.html_content||"")}</textarea>
    <div class="mu" style="margin-top:6px">${t("html_upload")}</div>
    <div class="upload-area" onclick="$('#pfile').click()">
      <div style="font-size:28px">📄</div><div>${t("upload_click")}</div>
      <input id="pfile" type="file" accept=".html,.htm" style="display:none" onchange="loadHtmlFile(this)">
    </div>
    <div id="html-prev"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn-green" style="flex:1" onclick="saveProduct()">${editingProduct?t("prod_update_btn"):t("prod_add_btn")}</button>
      ${editingProduct?`<button class="btn-grey" onclick="editingProduct=null;render()">${t("cancel")}</button>`:""}
    </div>
  </div>
  <h2 style="margin-top:8px">${t("cur_products")} (${st.products.length})</h2>
  ${st.products.map(p=>`<div class="prod-card">
    <div class="row"><div><b>${esc(p.name)}</b>${p.price?` <span style="color:var(--r);font-weight:700">₨${p.price}</span>`:""}</div>
    <div style="display:flex;gap:6px"><button style="padding:6px 12px;font-size:12px" onclick='startEditProd(${JSON.stringify(p).replace(/'/g,"&#39;")})'>✏️</button><button class="btn-red" style="padding:6px 12px;font-size:12px" onclick="deleteProd('${esc(p.id)}')">🗑️</button></div></div>
    ${p.desc?`<div class="mu">${esc(p.desc)}</div>`:""}
    ${p.html_content?`<div style="margin-top:8px;border-top:1px solid var(--bd);padding-top:8px">${p.html_content}</div>`:""}
  </div>`).join("")||`<div class="empty">${t("no_products")}</div>`}`;
}

function startEditProd(p){editingProduct=p;activeTab="products";render();setTimeout(()=>{if($('#phtml'))$('#phtml').value=p.html_content||""},60)}

function loadHtmlFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{const html=e.target.result;if($('#phtml'))$('#phtml').value=html;const prev=$('#html-prev');if(prev)prev.innerHTML=`<div style="border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:8px">${html}</div>`;toast("✅ File loaded!")};
  reader.readAsText(f)}

async function saveProduct(){
  const name=($('#pname').value||"").trim();
  if(!name){toast(t("prod_name").replace(" *","")+" "+t("err_fill"));return}
  const price=+($('#pprice').value||0),desc=($('#pdesc').value||"").trim(),html_content=($('#phtml').value||"").trim();
  const data={name,price,desc,html_content};
  try{
    if(editingProduct){await rpc("aab_update_product",{p_id:S.i,p_h:S.h,p_prod_id:editingProduct.id,...data})}
    else{await rpc("aab_add_product",{p_id:S.i,p_h:S.h,...data})}
    toast(t("ok_saved"));editingProduct=null;await refresh();render();
  }catch(e){
    // fallback localStorage
    const prods=JSON.parse(localStorage.getItem("aak_products")||"[]");
    if(editingProduct){const idx=prods.findIndex(x=>x.id===editingProduct.id);if(idx>=0)prods[idx]={...prods[idx],...data};else prods.push({id:"P"+Date.now(),...data})}
    else prods.push({id:"P"+Date.now(),...data,created:Date.now()});
    localStorage.setItem("aak_products",JSON.stringify(prods));st.products=prods;editingProduct=null;render();toast(t("ok_saved")+" (local)");}}

async function deleteProd(id){
  if(!confirm("Delete / ڈیلیٹ کریں؟"))return;
  try{await rpc("aab_delete_product",{p_id:S.i,p_h:S.h,p_prod_id:id})}catch(e){}
  const prods=JSON.parse(localStorage.getItem("aak_products")||"[]").filter(x=>x.id!==id);
  localStorage.setItem("aak_products",JSON.stringify(prods));
  await refresh();if(st.products.length===0)st.products=prods;render();toast("🗑️ Deleted")}

// ── ACCOUNTS ADMIN ────────────────────────────────────────────────────────
function renderAccounts(){
  const box=(r,lbl,icon)=>`<div class="card">
    <h2>${icon} ${lbl} (${st.creds[r+"s"]?.length||0})</h2>
    ${(st.creds[r+"s"]||[]).map(u=>`<div class="urow"><span>${icon} <b>${esc(u.name||u.id)}</b> <span class="mu" dir="ltr">${esc(u.id)}</span></span>
    <div style="display:flex;gap:5px"><button style="padding:5px 10px;font-size:11px" onclick="resetAcctPw('${r}','${esc(u.id)}')">${t("reset_pw")}</button>${r!=="admin"||u.id!==S.i?`<button class="btn-red" style="padding:5px 10px;font-size:11px" onclick="delAcct('${r}','${esc(u.id)}')">${t("remove")}</button>`:""}</div></div>`).join("")||`<div class="empty">—</div>`}
    <hr class="sec-div">
    <label>${r==="customer"?t("phone"):t("new_id")}</label><input id="na_${r}" dir="ltr" placeholder="${r==="customer"?"+923001234567":"user01"}">
    <label>${t("name")}</label><input id="nm_${r}" placeholder="Name / نام">
    <label>${t("pwd")}</label>${pwf("np_"+r,'autocomplete="new-password"')}
    <button class="btn-green btn-wide" onclick="addAcct('${r}')">${t("add_user")} ${icon}</button>
  </div>`;
  return box("admin",t("admins_lbl"),"🛡️")+box("user",t("users_lbl"),"🧑‍💼")+box("customer",t("cust_lbl"),"🛒");
}

async function addAcct(r){
  const id=($('#na_'+r).value||"").trim(),nm=($('#nm_'+r).value||"").trim(),p=($('#np_'+r).value||"");
  if(!id||!nm||!p){toast(t("err_fill"));return}
  if(!okPw(p,id)){toast(t("err_pw"));return}
  try{const h=await hp(id,p);const x=await rpc("aab_set_account",{p_id:S.i,p_h:S.h,p_role:r,p_target:id,p_newh:h,p_name:nm});
  if(x==="dup")return toast(t("err_dup"));if(x!=="ok")return toast(t("err_net"));
  $('#na_'+r).value="";$('#nm_'+r).value="";$('#np_'+r).value="";await refresh();render();toast(t("ok_done"))}catch(e){toast(t("err_net"))}}

async function delAcct(r,id){
  if(!confirm(`Remove ${id}?`))return;
  try{const x=await rpc("aab_del_account",{p_id:S.i,p_h:S.h,p_role:r,p_target:id});
  if(x==="last")return toast(t("cannot_last"));if(x==="self")return toast(t("cannot_self"));if(x!=="ok")return toast(t("err_net"));
  await refresh();render();toast(t("ok_done"))}catch(e){toast(t("err_net"))}}

async function resetAcctPw(r,id){
  const p=prompt(`New password for ${id}:`);if(!p)return;
  if(!okPw(p,id)){toast(t("err_pw"));return}
  try{const nh=await hp(id,p);await rpc("aab_reset_pw",{p_id:S.i,p_h:S.h,p_role:r,p_target:id,p_newh:nh});toast(t("ok_saved"))}catch(e){toast(t("err_net"))}}

// ── SETTINGS ADMIN ────────────────────────────────────────────────────────
function renderSettings(){
  return`<div class="card"><h2>${t("change_pw")}</h2><label>${t("newpwd")}</label>${pwf("mp",'autocomplete="new-password"')}<button class="btn-wide" onclick="adminChangePw()">${t("save")}</button></div>
  <div class="card"><h2>${t("prices")}</h2>
  <label>${t("rate")}</label><input id="pr1" type="number" min="0" dir="ltr" placeholder="300">
  <label>${t("rate_bulk")}</label><input id="pr2" type="number" min="0" dir="ltr" placeholder="200">
  <label>${t("bulk_from")}</label><input id="pr3" type="number" min="0" dir="ltr" placeholder="120">
  <label>${t("min_qty")}</label><input id="pr4" type="number" min="1" dir="ltr" placeholder="6">
  <label>${t("free_per")}</label><input id="pr5" type="number" min="0" dir="ltr" placeholder="12">
  <label>${t("free_qty")}</label><input id="pr6" type="number" min="0" dir="ltr" placeholder="2">
  <label>${t("delivery_charge")}</label><input id="pr7" type="number" min="0" dir="ltr" placeholder="0">
  <div class="mu" style="margin-top:6px">${t("price_hint")}</div>
  <button class="btn-wide btn-green" onclick="savePrices()">${t("save")}</button></div>
  <div class="card"><h2>${t("pay_title")}</h2>
  <label>${t("bank")}</label><input id="pbk" dir="ltr" placeholder="JazzCash / Easypaisa / HBL">
  <label>${t("acname")}</label><input id="ptt" placeholder="Account Title">
  <label>${t("acn")}</label><input id="pac" dir="ltr" placeholder="03001234567">
  <label>${t("adv_amt")}</label><input id="pad" type="number" min="0" dir="ltr" placeholder="1000">
  <button class="btn-wide" onclick="savePay()">${t("save")}</button></div>`;
}

async function adminChangePw(){
  const p=($('#mp').value||"");if(!okPw(p,S.i)){toast(t("err_pw"));return}
  try{const nh=await hp(S.i,p);const ok=await rpc("aab_change_pw",{p_role:"admin",p_id:S.i,p_h:S.h,p_newh:nh});
  if(!ok)return toast(t("err_net"));setSess("admin",S.i,nh,S.n);$('#mp').value="";toast(t("ok_saved"))}catch(e){toast(t("err_net"))}}

async function savePrices(){
  const v=[1,2,3,4,5,6,7].map(i=>parseInt(($('#pr'+i)||{}).value,10)||0);
  try{await rpc("aab_set_prices",{p_id:S.i,p_h:S.h,p_rate:v[0],p_rate_bulk:v[1],p_bulk_from:v[2],p_min:v[3],p_free_per:v[4],p_free_qty:v[5],p_delivery:v[6]});toast(t("ok_saved"))}catch(e){toast(t("err_net")+": "+e.message)}}

async function savePay(){
  try{const a=($('#pac').value||"").trim();
  await rpc("aab_set_pay",{p_id:S.i,p_h:S.h,p_title:($('#ptt').value||"").trim(),p_acct:a,p_bank:($('#pbk').value||"").trim(),p_adv:parseInt($('#pad').value,10)||0});
  toast(t("ok_saved"))}catch(e){toast(t("err_net")+": "+e.message)}}

// ══════════════════════════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════════════════════════
function renderLogin(){
  const role=currentRole;
  const isC=role==="customer";
  const lk={customer:"login_c",user:"login_u",admin:"login_a"}[role];
  side().classList.remove('vis');
  app().innerHTML=`<div class="login-wrap"><div class="login-card">
    <div class="login-icon">${ROLE_ICONS[role]}</div>
    <h2 style="text-align:center;margin-bottom:18px">${t(regOn?"signup":lk)}</h2>
    ${regOn&&isC?`
    <label>${t("name")}</label><input id="rn" autocomplete="name">
    <label>${t("phone")}</label>${phIn("ri",'autocomplete="username"')}
    <label>${t("pwd")}</label>${pwf("rp",'autocomplete="new-password"')}
    <button class="btn-wide btn-green" onclick="doReg()">${t("signup_btn")}</button>
    <p class="mu" style="text-align:center;margin-top:12px"><a href="#" onclick="event.preventDefault();regOn=false;render()">${t("have")}</a></p>
    `:`
    <label>${isC?t("phone"):t("uid")}</label>${isC?phIn("li",'autocomplete="username"'):'<input id="li" dir="ltr" autocomplete="username">'}
    <label>${t("pwd")}</label>${pwf("lp",'autocomplete="current-password"')}
    <button class="btn-wide btn-green" onclick="doLogin()">${t("signin_btn")}</button>
    ${isC?`<p class="mu" style="text-align:center;margin-top:12px"><a href="#" onclick="event.preventDefault();regOn=true;render()">${t("newhere")}</a></p>`:""}
    ${role==="admin"?`<p class="mu" style="text-align:center;font-size:12px">Default ID: <b>admin</b></p>`:""}
    `}
  </div></div>`;
}

async function doLogin(){
  const role=currentRole,isC=role==="customer";
  const raw=($('#li').value||"");
  const id=isC?normPh(raw):raw.trim();
  const p=($('#lp').value||"");
  if(!id||!p){toast(t("err_fill"));return}
  if(isC&&!okPh(id)){toast(t("err_phone"));return}
  try{const h=await hp(id,p);const x=await rpc("aab_login",{p_role:role,p_id:id,p_h:h});
  if(x&&x.ok){setSess(role,id,h,x.name);await refresh();render();toast(`Welcome! ${x.name||""}`)}
  else toast(x&&x.locked?t("err_lock"):t("err_bad"))}catch(e){toast(t("err_net"))}}

async function doReg(){
  const n=($('#rn').value||"").trim(),id=normPh(($('#ri').value||"")),p=($('#rp').value||"");
  if(!n||!id||!p){toast(t("err_fill"));return}
  if(!okPh(id)){toast(t("err_phone"));return}
  if(!okPw(p,id)){toast(t("err_pw"));return}
  try{const h=await hp(id,p);const x=await rpc("aab_register",{p_id:id,p_name:n,p_h:h});
  if(x==="dup")return toast(t("err_dup"));if(x!=="ok")return toast(t("err_net"));
  setSess("customer",id,h,n);regOn=false;await refresh();render();toast(`🎉 Account created! Welcome, ${n}`)}catch(e){toast(t("err_net"))}}

function logout(){setSess(null);st.orders=[];st.creds={admins:[],users:[],customers:[]};regOn=false;editingProduct=null;render()}

// ── HASH ROUTING ──────────────────────────────────────────────────────────
function checkHash(){
  const h=location.hash.slice(1);
  if(["customer","user","admin"].includes(h)){initRole(h);history.replaceState(null,"","#"+h)}
}

// ── INIT ──────────────────────────────────────────────────────────────────
applyLang();
checkHash();
if(!currentRole){
  // if session exists, restore role
  if(S.r&&["customer","user","admin"].includes(S.r)) initRole(S.r);
  else renderRolePick();
}
</script>
