main{max-width:900px;margin:0 auto;padding:16px}

button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--g);color:#fff}

function stepQ(d){const e=$("#cq");if(!e)return;e.value=Math.max(6,(+e.value||6)+d);calc()}
function calc(){const e=$("#cq");if(!e)return;const q=Math.max(1,+e.value||1),f=free(q),tx=taxOf(q);$("#tot").innerHTML=`<bdi dir="ltr">${q} × ₨${rate(q)} = ₨ ${q*rate(q)}</bdi>`+(tx?`<br>${t("taxl")} (<bdi dir="ltr">${st.tax}%</bdi> — ${q-6} ${t("bot")}): <bdi dir="ltr">₨ ${tx}</bdi>`:"")+`<br><b>${t("tot")}: <bdi dir="ltr">₨ ${q*rate(q)+tx}</bdi></b>`+(f?`<br>${t("free2").replace("{f}",f).replace("{t}",q+f)}`:"")+(q<6?`<br><span style="color:#ff6b61;font-weight:700">⚠️ ${t("min6")}</span>`:"");const ob=document.querySelector('button[onclick^="place"]');if(ob){ob.disabled=q<6;ob.style.opacity=q<6?".45":""}}
async function place(){
  const n=$("#cn").value.trim(),p=normPh($("#cp").value),a=$("#ca").value.trim(),q=Math.max(1,+$("#cq").value||1);
  if(!n||!p||!a)return toast(t("fill"));if(!okPh(p))return toast(t("badph"));if(q<6)return toast(t("min6"));$("#ca").value="";$("#cq").value=6;
  try{const id=await rpc("aab_place",{p_id:me("customer"),p_h:S.h,p_name:n,p_phone:p,p_addr:a,p_qty:q});if(!id){expire();return}if(id==="limit")return toast(t("lim"));if(id==="bad")return toast(t("fill"));if(id==="min")return toast(t("min6"));await refresh();last=id;toast(t("sent"));render(true)}catch(e){toast("Network error")}
}
const addrHtml=o=>{const ch=o.addr_old&&o.addr_old!==o.addr;if(!ch||!(S.r==="admin"||S.r==="user"))return esc(o.addr);return `<span style="text-decoration:line-through;opacity:.7">${t("oa")}: ${esc(o.addr_old)}</span><br><b style="color:var(--g2)">✏️ ${t("nad")}: ${esc(o.addr)}</b>`};
async function chAddr(id){try{const o=st.orders.find(x=>x.id===id);if(!o)return;const a=prompt(t("na"),o.addr);if(a===null)return;const n=a.trim();if(!n||n===o.addr)return;const ok=await rpc("aab_set_addr",{p_id:S.i,p_h:S.h,p_oid:id,p_addr:n});if(!ok)return toast(t("bad"));await refresh();render(true);toast(t("adok"))}catch(e){toast("Network error")}}
function card(o,btns){return `<div class="card"><div class="row"><b>${esc(o.id)}</b><span class="tag s-${o.status}">${t(o.status)}</span></div>
<div class="mu">${esc(o.name)} · <span dir="ltr">${esc(o.phone)}</span><br>${addrHtml(o)}</div>
<div style="margin-top:6px">${o.qty} ${t("bot")}${o.free?` + ${o.free} ${t("fr")}`:""} × <bdi dir="ltr">₨${o.rate}</bdi>${o.tax?` + ${t("taxl")} <bdi dir="ltr">₨${o.tax}</bdi>`:""} = <b><bdi dir="ltr">₨ ${o.total}</bdi></b></div>
<div class="row" style="margin-top:10px;justify-content:flex-start">${btns}</div></div>`}
const by=s=>st.orders.filter(o=>o.status===s);
function userNew(){const n=by("new"),s=by("submitted"),r=by("rejected"),a=by("approved");
  return `<h2 style="font-size:16px">${t("nw")} (${n.length})</h2>
${n.map(o=>card(o,`<button class="pr" onclick="chAddr('${o.id}')">${t("chg")}</button><button class="ok" onclick="setS('${o.id}','submitted')">${t("sub")}</button>`)).join("")||`<div class="empty">${t("none")}</div>`}
<h2 style="font-size:16px">${t("wait")} (${s.length})</h2>
${s.map(o=>card(o,"")).join("")||'<div class="empty">—</div>'}
<h2 style="font-size:16px">${t("gen")} / ${t("rp")} (${a.length})</h2>
${a.map(o=>card(o,`<button class="pr" onclick="slip('${o.id}')">${t("pr")}</button>`+waBtn(o))).join("")||`<div class="empty">${t("gnone")}</div>`}
${r.length?`<h2 style="font-size:16px">${t("rej")}</h2>`+r.map(o=>card(o,"")).join(""):""}
<div id="slipbox"></div>`}
function slip(id){const o=st.orders.find(x=>x.id===id);if(!o)return;
  $("#slipbox").innerHTML=`<div id="slip" class="printing"><div style="text-align:center"><b style="font-size:20px">🌿 آبِ خضری — ${t("rp")}</b><br><span class="mu">Cumin Water · ${t("dlv")}</span></div><hr>
  <p><b>${t("no2")}:</b> ${esc(o.id)}<br><b>${t("dt")}:</b> ${new Date(o.created).toLocaleDateString("en-GB")}<br><b>${t("nm")}:</b> ${esc(o.name)}<br><b>${t("ph")}:</b> <span dir="ltr">${esc(o.phone)}</span><br><b>${t("ad")}:</b> ${esc(o.addr)}</p>
  <p>${t("bt")}: <b>${o.qty}</b>${o.free?` + ${t("fr")}: <b>${o.free}</b>`:""}<br>${t("rate")}: ₨${o.rate}<br>${o.tax?`${t("taxl")} (${o.taxpct}%): ₨${o.tax}<br>`:""}<b style="font-size:18px">${t("tot")}: ₨ ${o.total}</b></p><div class="mu" style="text-align:center">${t("thanks")}</div></div>`;
  setTimeout(()=>window.print(),150)}
const pad=n=>String(n).padStart(2,"0");
const dk=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const DS={v:"month",y:new Date().getFullYear(),m:new Date().getMonth(),d:dk(Date.now())};
const SEC={admin:"dash",user:"dash"};
const tabs=(r,a)=>`<div class="tabs">${a.map(([k,l])=>`<button class="tb ${SEC[r]===k?"on":""}" onclick="SEC['${r}']='${k}';render(true)">${l}</button>`).join("")}</div>`;
const sales=()=>st.orders.filter(o=>o.status==="approved"),sdk=o=>dk(o.at||o.created);
const agg=a=>({n:a.length,b:a.reduce((x,o)=>x+o.qty+(o.free||0),0),r:a.reduce((x,o)=>x+o.total,0)});
const kps=a=>{const g=agg(a);return `<div class="kps"><div class="kp"><b>${g.n}</b>${t("od")}</div><div class="kp"><b>${g.b}</b>${t("bot")}</div><div class="kp"><b>₨ ${g.r}</b>${t("rev")}</div></div>`};
function mv(x){DS.m+=x;if(DS.m<0){DS.m=11;DS.y--}if(DS.m>11){DS.m=0;DS.y++}render(true)}
function dsh(x){const d=new Date(DS.d+"T00:00:00");d.setDate(d.getDate()+x);DS.d=dk(d.getTime());render(true)}
function setV(v){DS.v=v;render(true)}
function openDay(k){DS.d=k;DS.v="day";render(true)}
function dash(){
  const S=sales(),W=L==="ur"?["اتوار","پیر","منگل","بدھ","جمعرات","جمعہ","ہفتہ"]:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const sw=`<div class="tabs"><button class="tb ${DS.v==="day"?"on":""}" onclick="setV('day')">${t("day")}</button><button class="tb ${DS.v==="month"?"on":""}" onclick="setV('month')">${t("mon")}</button></div>`;
  if(DS.v==="day"){const a=S.filter(o=>sdk(o)===DS.d);
    return sw+`<div class="card row"><button class="tb" onclick="dsh(-1)">◀</button><input type="date" value="${DS.d}" style="width:auto" onchange="if(this.value){DS.d=this.value;render(true)}"><button class="tb" onclick="dsh(1)">▶</button></div>`+kps(a)+`<div style="height:12px"></div>`+(a.map(o=>card(o,cur==="user"?`<button class="pr" onclick="slip('${o.id}')">${t("pr")}</button>`+waBtn(o):"")).join("")||`<div class="empty">—</div>`)+(cur==="user"?'<div id="slipbox"></div>':"")}
  const n=new Date(DS.y,DS.m+1,0).getDate(),pre=new Date(DS.y,DS.m,1).getDay(),M={},ym=DS.y+"-"+pad(DS.m+1);
  S.forEach(o=>{const k=sdk(o);if(k.slice(0,7)===ym)(M[k]=M[k]||[]).push(o)});
  let c=W.map(w=>`<div class="cdh">${w}</div>`).join("")+"<div></div>".repeat(pre);
  for(let i=1;i<=n;i++){const k=ym+"-"+pad(i),g=M[k]?agg(M[k]):null;
    c+=`<div class="cd${g?" has":""}${k===dk(Date.now())?" td":""}" onclick="openDay('${k}')"><b>${i}</b>${g?`<span>${g.n} ${t("od")}</span><br><span>₨${g.r}</span>`:""}</div>`}
  return sw+`<div class="card row"><button class="tb" onclick="mv(-1)">◀</button><b>${new Date(DS.y,DS.m,1).toLocaleDateString(L==="ur"?"ur-PK":"en-GB",{month:"long",year:"numeric"})}</b><button class="tb" onclick="mv(1)">▶</button></div>`+kps(Object.values(M).flat())+`<div class="cal" style="margin-top:12px">${c}</div><div class="mu" style="margin-top:8px">${t("pend")}: <b>${by("submitted").length+by("new").length}</b></div>`}
function sheet(){const O=st.orders.slice().sort((a,b)=>b.created-a.created),h=["#",t("no2"),t("dt"),t("nm"),t("ph"),t("ad"),t("bt"),t("fr"),t("rate"),t("tot"),t("st2")];
  return `<div class="row" style="margin-bottom:10px"><b>${t("ss")} (${O.length})</b><button class="ok" onclick="xl()">${t("dx")}</button></div><div style="overflow-x:auto"><table class="xt"><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${O.map((o,i)=>`<tr><td>${i+1}</td><td>${esc(o.id)}</td><td>${dk(o.created)}</td><td>${esc(o.name)}</td><td>${esc(o.phone)}</td><td>${esc(o.addr)}</td><td>${o.qty}</td><td>${o.free||0}</td><td>${o.rate}</td><td>${o.total}</td><td>${t(o.status)}</td></tr>`).join("")||`<tr><td colspan="11">—</td></tr>`}</table></div>`}
async function xl(){let dl=null;try{dl=window.claude?await claude.use("downloads"):null}catch(e){}if(!window.XLSX)return toast(t("nodl"));
  const O=st.orders.slice().sort((a,b)=>a.created-b.created).map(o=>({[t("no2")]:o.id,[t("dt")]:dk(o.created),[t("nm")]:o.name,[t("ph")]:o.phone,[t("ad")]:o.addr,[t("oa")]:o.addr_old||"",[t("bt")]:o.qty,[t("fr")]:o.free||0,[t("rate")]:o.rate,[t("taxl")]:o.tax||0,[t("tot")]:o.total,[t("st2")]:t(o.status)}));
  const n=new Date(DS.y,DS.m+1,0).getDate(),D=[];
  for(let i=1;i<=n;i++){const k=DS.y+"-"+pad(DS.m+1)+"-"+pad(i),a=agg(sales().filter(o=>sdk(o)===k));D.push({[t("dt")]:k,[t("od")]:a.n,[t("bot")]:a.b,[t("rev")]:a.r})}
  const wb=XLSX.utils.book_new(),add=(r,n)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n);
  add(O,"Orders");add(D,"Daily "+DS.y+"-"+pad(DS.m+1));
  if(me("admin"))add(lst("customer").map(c=>({[t("nm")]:c.name||"",[t("ph")]:c.id})),"Customers");
  try{const fn="Aab-e-Khizri_"+dk(Date.now())+".xlsx";dl?await dl.save({filename:fn,data:new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})])}):XLSX.writeFile(wb,fn)}catch(e){if(!e||e.code!=="declined")toast(t("nodl"))}}
async function myPw(){try{const p=$("#mp").value;if(!p)return toast(t("need"));if(!okPw(p,S.i))return toast(t("pwl"));const nh=await hp(S.i,p);if(!await rpc("aab_change_pw",{p_role:S.r,p_id:S.i,p_h:S.h,p_newh:nh}))return toast(t("bad"));setSess(S.r,S.i,nh,S.n);$("#mp").value="";document.activeElement.blur();toast(t("done"))}catch(e){toast("Network error")}}

let fgOn=false;function toggleFg(){fgOn=!fgOn;render(true)}
function forgotView(r,first){const cu=r==="customer",ad=r==="admin";
  return `<div class="card${first?" lg":""}" style="max-width:380px;margin:20px auto;text-align:center"><div class="em" style="font-size:44px">🔑</div><h2>${t("fg")}</h2><div style="text-align:start">
<label>${t(cu?"ph":"uid")}</label>${cu?phIn("fi",'autocomplete="username"'):'<input id="fi" dir="ltr" autocomplete="username">'}
${ad?`<label>${t("rcl")}</label><input id="fc" dir="ltr" autocomplete="off">`:""}
<label>${t("np")}</label>${pwf("fp",'autocomplete="new-password"')}</div>
<div class="mu" style="margin-top:8px">${t(ad?"fgad":cu?"fgcu":"fgus")}</div>
<button class="big" style="background:var(--g)" onclick="doForgot('${r}')">${t(ad?"sv":"fgs")}</button>
<p class="mu"><a href="#" onclick="event.preventDefault();toggleFg()">${t("bk")}</a></p></div>`}
async function doForgot(r){try{const i=nid(r,$("#fi").value),p=$("#fp").value;if(!i||!p)return toast(t("need"));if(!okPw(p,i))return toast(t("pwl"));const nh=await hp(i,p);
  if(r==="admin"){const c=$("#fc").value.trim();if(!c)return toast(t("need"));if(!await rpc("aab_admin_recover",{p_id:i,p_codeh:await hp(i,"RC:"+c),p_newh:nh}))return toast(t("bad"));fgOn=false;render(true);return toast(t("done"))}
  const x=await rpc("aab_forgot",{p_role:r,p_id:i,p_newh:nh});if(x==="none")return toast(t("nf"));if(x!=="ok")return toast(t("bad"));fgOn=false;render(true);toast(t("fgok"))}catch(e){toast("Network error")}}
async function rstAcct(r,i){try{const p=prompt(t("np")+" — "+i);if(!p)return;if(!okPw(p,i))return toast(t("pwl"));if(!await rpc("aab_reset_pw",{p_id:S.i,p_h:S.h,p_role:r,p_target:i,p_newh:await hp(i,p)}))return toast(t("bad"));await refresh();render(true);toast(t("done"))}catch(e){toast("Network error")}}
async function rsAct(r,i,ok){try{await rpc("aab_resets_act",{p_role:S.r,p_id:S.i,p_h:S.h,p_trole:r,p_target:i,p_approve:ok});await refresh();render(true);toast(t("done"))}catch(e){toast("Network error")}}
const rsBox=()=>`<div class="card"><h2>${t("rq")} (${st.resets.length})</h2>${st.resets.map(u=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span dir="ltr">${u.role==="customer"?"🛒":"🧑‍💼"} <b>${esc(u.name)}</b> · ${esc(u.id)}</span><span><button class="ok" data-r="${u.role}" data-i="${esc(u.id)}" onclick="rsAct(this.dataset.r,this.dataset.i,true)">✔</button> <button class="no" data-r="${u.role}" data-i="${esc(u.id)}" onclick="rsAct(this.dataset.r,this.dataset.i,false)">✖</button></span></div>`).join("")||`<div class="empty">—</div>`}</div>`;
const rcBox=()=>{const m=st.creds.admins.find(u=>u.id===S.i)||{};return `<div class="card"><h2>${t("rch")}</h2><div class="mu">${m.rc?t("rcon"):t("rcoff")}</div><label>${t("rcl")}</label><input id="rcn" dir="ltr" autocomplete="off"><button class="big" style="background:#0b5fa5" onclick="setRc()">${t("sv")}</button></div>`};
async function setRc(){try{const c=$("#rcn").value.trim();if(c.length<4)return toast(t("rcs"));if(!await rpc("aab_set_recovery",{p_id:S.i,p_h:S.h,p_codeh:await hp(S.i,"RC:"+c)}))return toast(t("bad"));$("#rcn").value="";await refresh();render(true);toast(t("done"))}catch(e){toast("Network error")}}
const auditView=()=>`<div class="card"><h2>${t("slg")}</h2><div style="overflow-x:auto"><table class="xt"><tr><th>${t("dt")}</th><th>ID</th><th>Action</th><th>Target</th></tr>${st.audit.map(a=>`<tr><td dir="ltr">${new Date(a.ts).toLocaleString("en-GB")}</td><td>${esc(a.actor||"")}</td><td>${a.ok?"✅":"⚠️"} ${esc(a.action)}</td><td>${esc(a.target||"")}</td></tr>`).join("")||`<tr><td colspan="4">—</td></tr>`}</table></div></div>`;
const waBtn=o=>`<button class="ok" onclick="wa('${o.id}')">${t("wa")}</button>`;
function wa(id){const o=st.orders.find(x=>x.id===id);if(!o)return;const m=L==="ur"?`السلام علیکم ${o.name}، آپ کا آرڈر ${o.id} (${o.qty} بوتل، ₨${o.total}) منظور ہو گیا ہے۔ شکریہ — آبِ خضری 🌿`:`Hello ${o.name}, your order ${o.id} (${o.qty} bottles, ₨${o.total}) has been approved. Thank you — Aab-e-Khizri 🌿`;window.open("https://wa.me/"+String(o.phone).replace(/\D/g,"")+"?text="+encodeURIComponent(m),"_blank","noopener")}
const taxBox=()=>`<div class="card"><h2>${t("taxh")}</h2><label>%</label><input id="txp" type="number" min="0" max="100" step="0.1" dir="ltr" value="${st.tax}"><button class="big" style="background:#0b5fa5" onclick="setTax()">${t("sv")}</button></div>`;
async function setTax(){try{const v=parseFloat($("#txp").value);if(!(v>=0&&v<=100))return toast(t("bad"));if(!await rpc("aab_set_tax",{p_id:S.i,p_h:S.h,p_pct:v}))return toast(t("bad"));await refresh();render(true);toast(t("done"))}catch(e){toast("Network error")}}
const pwBox=()=>`<div class="card"><h2>${t("pwn")}</h2><label>${t("np")}</label>${pwf("mp",'autocomplete="new-password"')}<button class="big" style="background:#0b5fa5" onclick="myPw()">${t("sv")}</button></div>`;
const custBox=()=>`<div class="card"><h2>${t("m_customer")} (${lst("customer").length})</h2>${lst("customer").map(u=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span dir="ltr">🛒 <b>${esc(u.name||"")}</b> · ${esc(u.id)}</span><span><button class="pr" data-r="customer" data-i="${esc(u.id)}" onclick="rstAcct(this.dataset.r,this.dataset.i)">${t("rs")}</button> <button class="no" data-r="customer" data-i="${esc(u.id)}" onclick="delAcct(this.dataset.r,this.dataset.i)">${t("rm")}</button></span></div>`).join("")||`<div class="empty">${t("nousr")}</div>`}</div>`;
function user(){return outBtn()+`<h2>${t("up")}</h2>`+tabs("user",[["dash",t("sd")],["new",t("sn")],["sheet",t("ss")],["pw",t("sp")+(st.resets.length?" ("+st.resets.length+")":"")]])+({dash,new:userNew,sheet,pw:()=>rsBox()+pwBox()})[SEC.user]()}
function admin(){return outBtn()+`<h2>${t("ap")}</h2>`+tabs("admin",[["dash",t("sd")],["appr",t("sa2")+" ("+by("submitted").length+")"],["sheet",t("ss")],["acct",t("sc2")+(st.resets.length?" ("+st.resets.length+")":"")],["log",t("slg")]])+({dash,appr:adminAppr,sheet,log:auditView,acct:()=>rsBox()+taxBox()+rcBox()+pwBox()+acctBox("admin")+acctBox("user")+custBox()})[SEC.admin]()}
function adminAppr(){const s=by("submitted");return `<h2 style="font-size:16px">${t("forap")} (${s.length})</h2>`+(s.map(o=>card(o,`<button class="ok" onclick="setS('${o.id}','approved')">${t("ok")}</button><button class="no" onclick="setS('${o.id}','rejected')">${t("no")}</button>`)).join("")||`<div class="empty">${t("clear")}</div>`)}
async function setS(id,s){try{const ok=await rpc("aab_set_status",{p_role:S.r,p_id:S.i,p_h:S.h,p_oid:id,p_status:s});await refresh();render(true);if(ok)toast(t(s==="approved"?"t2":s==="submitted"?"t1":"t3"))}catch(e){toast("Network error")}}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);cur=["admin","user"].includes(h)?h:"customer";render(true)});render();
</script></body></html>
