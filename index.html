<style>
:root{--bg:#f3f8ee;--card:#fff;--tx:#17301c;--mu:#5d7262;--g:#1f6b34;--g2:#2f8f47;--r:#b3141b;--y:#f6c32b;--bd:#dce9d4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c12;--card:#182a1c;--tx:#e8f3e6;--mu:#9bb5a0;--bd:#2a4330}}
:root[data-theme="dark"]{--bg:#0f1c12;--card:#182a1c;--tx:#e8f3e6;--mu:#9bb5a0;--bd:#2a4330}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Poppins,"Noto Naskh Arabic",system-ui,sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,#14502a,#2f8f47);color:#fff;padding:18px 16px 14px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 6px 18px #0003}
header h1{margin:0;font-size:28px;letter-spacing:1px}
header .ur{font-family:"Noto Nastaliq Urdu",serif;font-size:24px;color:var(--y);line-height:2}
header small{opacity:.9}
nav{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;padding:8px 16px;border-radius:99px;background:#ffffff26;font-weight:600;font-size:14px}
nav a.on{background:var(--y);color:#3a2a00}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0000000d}
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff7d6,#ffe7a0);color:#3a2a00}
.hero .em{font-size:56px}
.price{font-size:30px;font-weight:700;color:var(--r)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--g);color:#fff;border-radius:99px;padding:3px 10px;font-size:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--g2)}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--g);color:#fff}
button.big{width:100%;margin-top:14px;padding:13px;font-size:16px;background:linear-gradient(135deg,var(--r),#d9342b)}
button.ok{background:var(--g2)}button.no{background:#8a8a8a}button.pr{background:#0b5fa5}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.s-new{background:#fff1c2;color:#6b4e00}.s-submitted{background:#d7e8ff;color:#0b3f78}.s-approved{background:#d3f2da;color:#12582a}.s-rejected{background:#fbd5d5;color:#8a1111}.s-cancelled{background:#e6e9ec;color:#46525c}
.mu{color:var(--mu);font-size:13px}
h2{margin:6px 0 12px;font-size:19px}
.empty{text-align:center;color:var(--mu);padding:24px}
.tot{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:12px}
#slip{border:2px dashed var(--g);border-radius:14px;padding:14px;margin-top:10px;background:var(--card)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#17301c;color:#fff;padding:10px 18px;border-radius:99px;z-index:9;display:none}
@media print{body *{visibility:hidden}.printing,.printing *{visibility:visible}.printing{position:absolute;left:0;top:0;width:100%;border:0;margin:0}}

header{background:linear-gradient(135deg,#0f4a24,#1f7a3a 60%,#2f8f47);padding:22px 16px 20px;border-radius:0 0 32px 32px}
header h1{font-weight:700;font-size:26px}
nav{margin-top:8px}
.card{border-radius:20px;padding:20px;box-shadow:0 4px 18px #14502a14;border:1px solid var(--bd)}
.hero{display:flex;flex-direction:row;gap:18px;align-items:center;background:linear-gradient(135deg,#fffaf0,#fdeec0);border:1px solid #f1dc9a}
.bt{height:230px;width:auto;flex:none;filter:drop-shadow(0 10px 14px #0003)}
.hero>div{flex:1;min-width:0}
.price{font-size:34px;margin:6px 0}
h2{font-weight:700;color:var(--g)}
button{transition:transform .12s,box-shadow .12s;box-shadow:0 2px 6px #0002}
button:hover{transform:translateY(-1px);box-shadow:0 5px 12px #0003}
input,textarea{border-radius:12px;padding:12px 14px;background:var(--card)}
input:focus,textarea:focus{box-shadow:0 0 0 3px #2f8f4730}
.tag{letter-spacing:.2px}
@media(max-width:420px){.bt{height:170px}}
.pw{position:relative}.pw input{padding-inline-end:46px}.eye{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);background:none;box-shadow:none;color:inherit;padding:8px;font-size:18px}.eye:hover{transform:translateY(-50%);box-shadow:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tb{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none;padding:8px 14px}.tb.on{background:var(--g);color:#fff}
.kps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kp{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--mu)}.kp b{display:block;font-size:19px;color:var(--g)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;direction:ltr}.cdh{text-align:center;font-size:11px;color:var(--mu)}.cd{min-height:60px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px;font-size:10px;cursor:pointer;overflow:hidden;line-height:1.3}.cd b{display:block;font-size:13px}.cd.has{background:#d3f2da;color:#12582a}.cd.td{outline:2px solid var(--y)}
.xt{border-collapse:collapse;font-size:12px;width:100%;direction:ltr}.xt th,.xt td{border:1px solid var(--bd);padding:5px 8px;white-space:nowrap;text-align:start}.xt th{background:var(--g);color:#fff}
.phw{display:flex;direction:ltr}.phw span{display:flex;align-items:center;padding:0 12px;background:var(--bd);border-radius:12px 0 0 12px;font-weight:600}.phw input{border-radius:0 12px 12px 0}

@keyframes dn{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}
@keyframes upin{from{transform:translateY(75vh) scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-9px) rotate(5deg)}}
@keyframes glow{0%,100%{box-shadow:0 10px 30px #2f8f4733}50%{box-shadow:0 10px 44px #f6c32b55}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
header.in{animation:dn 1.1s cubic-bezier(.2,.9,.25,1) both}
header h1{background:linear-gradient(100deg,#fff 30%,#f6c32b 50%,#fff 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s 1.2s linear infinite}
.card.lg{animation:upin 1.2s .35s cubic-bezier(.2,.9,.25,1) both,glow 4s 1.6s ease-in-out infinite;background:linear-gradient(160deg,var(--card),var(--bg));border:1px solid #f6c32b77;border-radius:26px}
.lg .em{display:inline-block;animation:fl 3s ease-in-out infinite}
body,.card,input,textarea,label,h2,main{transition:background-color 1.6s ease,color 1.6s ease,border-color 1.6s ease}
@media(prefers-reduced-motion:reduce){header.in,.card.lg,.lg .em,header h1{animation:none}}
:root[data-theme="dark"] h2{color:#8fe0a0}
.card a,main a{color:#d98a00;font-weight:600}:root[data-theme="dark"] .card a,:root[data-theme="dark"] main a{color:#f6c32b}

/* v4.0 portal: role picker + sidebar + role colours */
html{--ac:#3f93c4;--acs:#63b0dc;--hb1:#c5e4f7;--hb2:#a5d3ee;--ht:#1d4a68}
html[data-role=user]{--ac:#1a7a3a;--acs:#2f9f50;--hb1:#b6e6c6;--hb2:#7cc99a;--ht:#17482b}
html[data-role=admin]{--ac:#6b3db5;--acs:#8a5cd8;--hb1:#d3c0f7;--hb2:#a88ae0;--ht:#2a0a5a}
html[data-role=user][data-theme]{--g:#1a7a3a;--g2:#2f9f50}
html[data-role=admin][data-theme]{--g:#6b3db5;--g2:#8a5cd8}
html[data-role=user] body{background:linear-gradient(180deg,#c8ecd4,#dff2e7 50%,#f0faf4) fixed}
html[data-role=admin] body{background:linear-gradient(180deg,#e0d4f7,#ede4ff 50%,#f7f2ff) fixed}
header{background:linear-gradient(135deg,var(--hb1),var(--hb2));color:var(--ht);position:relative;padding:12px 16px 12px}

.logo{width:min(170px,46vw);margin:0 auto 6px;filter:drop-shadow(0 6px 14px #0006)}.rp-logo{width:min(200px,56vw)}.lg-img{display:block;width:100%;height:auto;border-radius:50%}
.hdr-btns{position:absolute;top:12px;inset-inline-end:12px;display:flex;gap:6px}

button{background:linear-gradient(135deg,var(--ac),var(--acs));box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 35%,transparent)}
h2,.kp b{color:var(--ac)}.tb.on{background:var(--ac)}.xt th{background:var(--ac)}
.s-cancelled{background:#e6e9ec;color:#46525c}
.role-pick{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 16px 30px}
.rp-logo{filter:drop-shadow(0 8px 14px #0003)}
.role-pick h2{margin:0 0 4px;text-align:center}
.rcard{display:flex;align-items:center;gap:16px;background:#fff;border:2px solid var(--bd);border-radius:22px;padding:16px 20px;width:100%;max-width:360px;cursor:pointer;box-shadow:0 4px 14px #0001;transition:.15s}
.rcard:hover{transform:translateY(-3px);border-color:#3f93c4}.rcard .ri{font-size:34px}.rcard .rt{font-weight:700}.rcard .rs{font-size:12px;color:var(--mu)}
.shell{display:flex;max-width:1000px;margin:0 auto;padding:14px 8px 0;direction:ltr}html[dir=rtl] .mainc{direction:rtl}

.sb:hover{background:color-mix(in srgb,var(--ac) 10%,transparent)}.sb .si{font-size:22px;line-height:1}

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);

		var data = dataList[i];

	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}
	if (buffer.getLengthInBits() > totalDataCount * 8) {

            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

		buffer.put(0, 4);
	}
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}
	while (true) {
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);

QRCode.createBytes = function(buffer, rsBlocks) {

	for (var r = 0; r < rsBlocks.length; r++) {
		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;
		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		dcdata[r] = new Array(dcCount);

		}
	}

	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}
	var data = new Array(totalCodeCount);
	var index = 0;
	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {

			}

	}

		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}

const MRX=/<!--aabmeta:(\{[^}]*\})-->/;
function pmeta(p){const m=MRX.exec((p&&p.html_content)||"");let o={};try{o=m?JSON.parse(m[1]):{}}catch(e){}return{stock:(o.stock===null||o.stock===undefined||o.stock==="")?null:Math.max(0,+o.stock||0),pack:Math.max(0,+o.pack||0)}}

function cartons(m){if(!m.pack||m.stock===null)return"";const c=Math.floor(m.stock/m.pack),r=m.stock%m.pack;return c+" "+t("pk_carton")+(r?" + "+r+" "+t("pk_loose"):"")}
function stp(id,val,step){return `<div class="stp"><button type="button" class="no" onclick="stepIn('${id}',-${step})">▼</button><input id="${id}" type="number" min="0" dir="ltr" value="${val}" oninput="psum()"><button type="button" class="ok" onclick="stepIn('${id}',${step})">▲</button></div>`}
function stepIn(id,d){const e=$("#"+id);e.value=Math.max(0,(+e.value||0)+d);psum()}
function psum(){const a=$("#psum");if(!a)return;const s=$("#pstock").value,k=+$("#ppack").value||0,pr=+$("#pprice").value||0,m={stock:s===""?null:+s,pack:k},o=[];if(k)o.push(t("pk_cprice")+": "+k+" × ₨"+pr+" = <b>₨"+(k*pr)+"</b>");const c=cartons(m);if(c)o.push(t("pk_sum")+": <b>"+c+"</b>");a.innerHTML=o.join("<br>")||"—"}

function pcard(p){const m=pmeta(p),c=cartons(m),id=esc(p.id);return `<div class="tot" style="margin-top:8px">${m.stock!==null?"📦 "+t("pk_st")+": <b>"+m.stock+"</b> "+t("pk_btl"):"📦 "+t("pk_none")}${m.pack?" · "+t("pk_ct")+": "+m.pack+" → <b>"+(c||"—")+"</b>":""}${m.pack&&+p.price?"<br>"+t("pk_cprice")+": <b>₨"+(m.pack*(+p.price))+"</b>":""}</div><div class="row" style="margin-top:8px;justify-content:flex-start;gap:6px;flex-wrap:wrap"><span class="mu">${t("pk_pu")}</span><button class="no" onclick="adjP('${id}','price',-10)">▼10</button><button class="ok" onclick="adjP('${id}','price',10)">▲10</button><span class="mu">${t("pk_st")}</span><button class="no" onclick="adjP('${id}','stock',-1)">−1</button><button class="ok" onclick="adjP('${id}','stock',1)">+1</button>${m.pack?`<button class="no" onclick="adjP('${id}','stock',-${m.pack})">−${t("pk_ct")}</button><button class="ok" onclick="adjP('${id}','stock',${m.pack})">+${t("pk_ct")}</button>`:""}</div>`}
async function adjP(id,f,d){const p=PM[id];if(!p)return;const m=pmeta(p);let price=+p.price||0;if(f==="price")price=Math.max(0,price+d);else m.stock=Math.max(0,(m.stock||0)+d);const dd={name:p.name,price,desc:p.desc||"",html_content:pwrap(p.html_content,m)};try{await rpc("aab_update_product",{p_id:S.i,p_h:S.h,p_prod_id:p.id,...dd})}catch(e){const a=lp(),i=a.findIndex(x=>x.id===p.id);if(i>=0)a[i]={...a[i],...dd};else a.push({id:p.id,...dd});try{localStorage.setItem("aak_products",JSON.stringify(a))}catch(e2){}}await refresh();render(true)}

const rsBox=()=>`<div class="card"><h2>${t("rq")} (${st.resets.length})</h2>${st.resets.map(u=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span dir="ltr">${u.role==="customer"?"🛒":"🧑‍💼"} <b>${esc(u.name)}</b> · ${esc(u.id)}</span><span><button class="ok" data-r="${u.role}" data-i="${esc(u.id)}" onclick="rsAct(this.dataset.r,this.dataset.i,true)">✔</button> <button class="no" data-r="${u.role}" data-i="${esc(u.id)}" onclick="rsAct(this.dataset.r,this.dataset.i,false)">✖</button></span></div>`).join("")||`<div class="empty">—</div>`}</div>`;

async function setRc(){try{const c=$("#rcn").value.trim();if(c.length<4)return toast(t("rcs"));if(!await rpc("aab_set_recovery",{p_id:S.i,p_h:S.h,p_codeh:await hp(S.i,"RC:"+c)}))return toast(t("bad"));$("#rcn").value="";await refresh();render(true);toast(t("done"))}catch(e){toast("Network error")}}
const auditView=()=>`<div class="card"><h2>${t("slg")}</h2><div style="overflow-x:auto"><table class="xt"><tr><th>${t("dt")}</th><th>ID</th><th>Action</th><th>Target</th></tr>${st.audit.map(a=>`<tr><td dir="ltr">${new Date(a.ts).toLocaleString("en-GB")}</td><td>${esc(a.actor||"")}</td><td>${a.ok?"✅":"⚠️"} ${esc(a.action)}</td><td>${esc(a.target||"")}</td></tr>`).join("")||`<tr><td colspan="4">—</td></tr>`}</table></div></div>`;

function wa(id){const o=st.orders.find(x=>x.id===id);if(!o)return;const m=L==="ur"?`السلام علیکم ${o.name}، آپ کا آرڈر ${o.id} (${o.qty} بوتل، ₨${o.total}) منظور ہو گیا ہے۔ شکریہ — آبِ خضری 🌿`:`Hello ${o.name}, your order ${o.id} (${o.qty} bottles, ₨${o.total}) has been approved. Thank you — Aab-e-Khizri 🌿`;window.open("https://wa.me/"+String(o.phone).replace(/\D/g,"")+"?text="+encodeURIComponent(m+waAdv(o)),"_blank","noopener")}

const priceBox=()=>{const c=st.cfg,f=(id,k,v)=>`<label>${t(k)}</label><input id="${id}" type="number" min="0" step="1" dir="ltr" value="${v}">`;return `<div class="card"><h2>${t("prh")}</h2>${f("pr1","rt",c.rate)}${f("pr2","rtb",c.rate_bulk)}${f("pr3","bkf",c.bulk_from)}${f("pr4","mnq",c.min_qty)}${f("pr5","frp",c.free_per)}${f("pr6","frq",c.free_qty)}${f("pr7","dvc",c.delivery)}<div class="mu" style="margin-top:6px">${t("prhint")}</div><button class="big" style="background:#0b5fa5" onclick="setPrices()">${t("sv")}</button></div>`};
async function setPrices(){try{const g=i=>parseInt($("#pr"+i).value,10),v=[1,2,3,4,5,6,7].map(g);if(v.some(x=>!(x>=0)))return toast(t("prbad"));if(!await rpc("aab_set_prices",{p_id:S.i,p_h:S.h,p_rate:v[0],p_rate_bulk:v[1],p_bulk_from:v[2],p_min:v[3],p_free_per:v[4],p_free_qty:v[5],p_delivery:v[6]}))return toast(t("prbad"));await refresh();render(true);toast(t("done"))}catch(e){toast(e&&/ 404$/.test(e.message||"")?t("sqlmiss"):(e&&e.message?e.message:"Network error"))}}
const payBox=()=>`<div class="card"><h2>${t("payh")}</h2>${st.payOk===false?`<div class="tot" style="color:#d98a00;border:1.5px solid #d98a00">⚠️ ${t("sqlmiss")}</div>`:""}<label>${t("bank")}</label><input id="pbk" dir="ltr" value="${esc(st.pay.bank)}"><label>${t("acname")}</label><input id="ptt" value="${esc(st.pay.title)}"><label>${t("acn")}</label><input id="pac" dir="ltr" value="${esc(st.pay.acct)}"><label>${t("advamt")}</label><input id="pad" type="number" min="0" step="1" dir="ltr" value="${st.pay.adv}"><div class="mu" style="margin-top:6px">${t("ahint")}</div>${st.pay.acct||st.qrImg?`<div style="text-align:center;margin-top:12px">${qrBlock()}<br><button type="button" class="pr" style="margin-top:8px" onclick="dlQR()">⬇️ ${t("dlq")}</button></div>`:""}<label>${t("qru")}</label><input id="qrf" type="file" accept="image/*" onchange="pickQR(this)">${st.qrImg?`<button type="button" class="no" style="margin-top:8px" onclick="delQR()">🗑️ ${t("qrrm")}</button>`:""}<div class="mu" style="margin-top:4px">${t("qruh")}</div><button class="big" style="background:#0b5fa5" onclick="setPay()">${t("sv")}</button></div>`;
function pickQR(inp){const f=inp.files&&inp.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast(t("qrbad"));const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{try{const M=720,k=Math.min(1,M/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let d=c.toDataURL("image/png");if(d.length>420000)d=c.toDataURL("image/jpeg",.92);if(d.length>440000)return toast(t("qrbig"));if(!await rpc("aab_set_qr",{p_id:S.i,p_h:S.h,p_qr:d}))return toast(t("savefail"));await refresh();render(true);toast(t("done"))}catch(e){toast(e&&/ 404$/.test(e.message||"")?t("sqlmiss"):"Error")}};im.onerror=()=>toast(t("qrbad"));im.src=r.result};r.readAsDataURL(f)}
async function delQR(){try{if(!await rpc("aab_set_qr",{p_id:S.i,p_h:S.h,p_qr:""}))return toast(t("savefail"));await refresh();render(true);toast(t("done"))}catch(e){toast("Network error")}}
async function setPay(){try{const a=$("#pac").value.trim(),v=parseInt($("#pad").value,10);if(!(v>=0))return toast(t("bad"));if(v>0&&!a)return toast(t("needacct"));if(!await rpc("aab_set_pay",{p_id:S.i,p_h:S.h,p_title:$("#ptt").value.trim(),p_acct:a,p_bank:$("#pbk").value.trim(),p_adv:v}))return toast(t("savefail"));await refresh();render(true);toast(t("done"))}catch(e){toast(e&&/ 404$/.test(e.message||"")?t("sqlmiss"):(e&&e.message?e.message:"Network error"))}}
